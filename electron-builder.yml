appId: dev.alavi.atlas
productName: Atlas
directories:
  output: release
  buildResources: desktop
files:
  - dist/**
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/backend.cjs
  - desktop/netProxy.cjs
  - desktop/tasks.cjs
  - desktop/mcp.cjs
  - desktop/updater.cjs
extraResources:
  - from: desktop/package-type
    to: package-type
publish:
  provider: github
  owner: aec-lang
  repo: Atlas-v4
  releaseType: release
electronLanguages:
  - en-US
linux:
  icon: desktop/icons
  category: Utility
  target:
    - AppImage
appImage:
  artifactName: Atlas-${version}-${arch}.AppImage
win:
  signAndEditExecutable: false
  target:
    - nsis
    - portable
nsis:
  artifactName: Atlas-${version}-${arch}-Setup.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: true
portable:
  artifactName: Atlas-${version}-${arch}.exe

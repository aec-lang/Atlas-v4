appId: dev.alavi.atlas
productName: Atlas
directories:
  output: release
  buildResources: desktop
files:
  - dist/**
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/backend.cjs
electronLanguages:
  - en-US
linux:
  icon: desktop/icons
  category: Utility
  target:
    - AppImage
appImage:
  artifactName: Atlas-${version}-${arch}.AppImage
win:
  target:
    - portable
portable:
  artifactName: Atlas-${version}-${arch}.exe

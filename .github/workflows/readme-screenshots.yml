name: Refresh README screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the actual web UI
        run: npm run build
      - name: Install screenshot tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-readme-tools" --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/atlas-readme-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture clean UI screenshots
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/atlas-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173 > /dev/null; then break; fi
            sleep 1
          done
          ATLAS_PLAYWRIGHT_MODULE="$RUNNER_TEMP/atlas-readme-tools/node_modules/playwright/index.mjs" node scripts/capture-readme.mjs
      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: readme-screenshots
          path: docs/assets/screenshots/*.png
          if-no-files-found: error
      - name: Save screenshots to the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/screenshots/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh real UI screenshots [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
